<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FF Code Checker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #fff;
      background: radial-gradient(
        circle at top,
        #451313 0%,
        #100505 55%,
        #050505 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 30px;
      background: #151515;
      border: 1px solid #ff3b30;
      border-radius: 20px;
      box-shadow: 0 0 35px rgba(255, 59, 48, 0.25);
    }

    .logo {
      text-align: center;
      font-size: 50px;
    }

    h1 {
      margin: 10px 0;
      text-align: center;
      color: #ff453a;
    }

    .subtitle {
      margin-bottom: 25px;
      color: #aaa;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #444;
      border-radius: 10px;
      outline: none;
      background: #080808;
      color: #fff;
      font-size: 16px;
    }

    input:focus {
      border-color: #ff453a;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #ff453a;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ff6258;
    }

    button:active {
      transform: scale(0.99);
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.5;
    }

    #result.valid {
      display: block;
      color: #6ff0a0;
      background: rgba(40, 200, 100, 0.12);
      border: 1px solid #35d477;
    }

    #result.invalid {
      display: block;
      color: #ff8179;
      background: rgba(255, 60, 50, 0.12);
      border: 1px solid #ff453a;
    }

    .demo {
      margin-top: 25px;
      padding: 15px;
      border-radius: 10px;
      background: #0d0d0d;
      color: #aaa;
      font-size: 14px;
      line-height: 1.6;
    }

    .demo strong {
      color: #fff;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo">🎮</div>

    <h1>FF Code Checker</h1>

    <div class="subtitle">
      Kiểm tra mã Free Fire nhanh chóng
    </div>

    <label for="code">Nhập mã</label>

    <input
      id="code"
      type="text"
      placeholder="Ví dụ: FF-DEMO-2026"
      autocomplete="off"
    >

    <button id="checkButton">
      🔍 Kiểm tra mã
    </button>

    <div id="result"></div>

    <div class="demo">
      <strong>Mã demo để thử:</strong><br>
      FF-DEMO-2026<br>
      PLAY-BOOST-123<br>
      FF-CHECK-999
    </div>

    <footer>
      Demo học tập — không yêu cầu mật khẩu hoặc OTP.
    </footer>
  </div>

  <script>
    const validCodes = {
      "FF-DEMO-2026": "Mã hợp lệ 🎉",
      "PLAY-BOOST-123": "Mã hợp lệ 🎉",
      "FF-CHECK-999": "Mã hợp lệ 🎉"
    };

    const input = document.getElementById("code");
    const button = document.getElementById("checkButton");
    const result = document.getElementById("result");

    function checkCode() {
      const code = input.value.trim().toUpperCase();

      result.className = "";

      if (!code) {
        result.textContent = "⚠️ Vui lòng nhập mã.";
        result.className = "invalid";
        return;
      }

      if (validCodes[code]) {
        result.textContent = "✅ " + validCodes[code];
        result.className = "valid";
      } else {
        result.textContent = "❌ Mã không hợp lệ hoặc không tồn tại.";
        result.className = "invalid";
      }
    }

    button.addEventListener("click", checkCode);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        checkCode();
      }
    });
  </script>
</body>
</html>
